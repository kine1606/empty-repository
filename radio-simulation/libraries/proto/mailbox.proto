syntax = "proto3";

package mailbox;

import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";

enum ErrorCode {
    OK = 0;
    MISSING_REQUIRED_FIELD = 1;
    INVALID_ADDRESS = 2;
    INVALID_PAYLOAD = 3;
    INTERNAL_ERROR = 4;
}

message MailboxRequest {
    string request_id = 1;
    string source = 2;
    string destination = 3;
    google.protobuf.Any payload = 4;
}

// Request payload sent from Node A to Node B
message NodeBRequest {
    string command = 1;
    int32 transaction_id = 2;
    string data = 3;
}

// Distinct response 1: Validation response sent from Node B back to Node A
message ValidationResponse {
    string request_id = 1;
    bool is_valid = 2;
    ErrorCode error_code = 3;
    string message = 4;
}

// Distinct response 2: Business logic response sent from Node B back to Node A
message NodeAResponse {
    string request_id = 1;
    string status = 2;
    int32 result_code = 3;
    string result_details = 4;
}

// return empty here because gRPC force to return something when sending.
// so the Response instead of directly sent back, I will send an Empty message
// the real response will be sent by another SendMessage() call from the other side
service MailboxService {
    rpc SendMessage(MailboxRequest) returns (google.protobuf.Empty);
}
