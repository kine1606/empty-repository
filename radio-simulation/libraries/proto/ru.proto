syntax = "proto3";

package ru;

// RU-specific request definitions
message RURequest {
    string command = 1;
    int32 transaction_id = 2;
    double tx_power_dbm = 3;
    double center_freq_mhz = 4;
    int32 antenna_ports = 5;
    string additional_params = 6;
}

// RU-specific response definitions
message RUResponse {
    string request_id = 1;
    int32 status_code = 2;
    string status_message = 3;
    string rf_state = 4;
    double actual_tx_power = 5;
    double actual_freq_mhz = 6;
    string details = 7;
}
